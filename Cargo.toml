[package]
name = "bluetooth-timeout"
version = "0.2.2"
edition = "2024"
description = "Automatically powers off idle Bluetooth adapters after a configurable inactivity timeout"
license = "MIT"
repository = "https://github.com/hendrikboeck/bluetooth-timeout"
authors = ["Hendrik Böck <hendrikboeck.dev@protonmail.com>"]
keywords = ["bluetooth", "timeout", "daemon", "bluez", "dbus"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
console-subscriber = { version = "0.5.0", optional = true }
futures-util = "0.3.33"
humantime = "2.4.0"
mlua = { version = "0.12.0", features = ["lua54", "vendored", "send"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34+deprecated"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "signal",
] }
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
xdg = "3.0.0"
zbus = { version = "5.18.0", features = ["tokio"] }

[features]
tokio-console = ["dep:console-subscriber"]

[profile.release]
opt-level = "z"   # optimize for size (like ReleaseSmall)
lto = true        # link-time optimization
codegen-units = 1 # single codegen unit, better LTO
strip = true      # strip debug symbols
